name: Lint

on:
  push:
    paths:
      - "charts/**"
      - ".github/workflows/lint.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      - name: Lint chart
        run: helm lint charts/rustdesk-server --strict
