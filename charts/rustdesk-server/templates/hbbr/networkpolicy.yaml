{{- if and .Values.hbbr.enabled .Values.networkPolicy.enabled }}
{{- $hbbr := .Values.hbbr }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rustdesk-server.hbbr.fullname" . }}
  namespace: {{ include "rustdesk-server.namespace" . | quote }}
  labels: {{- include "rustdesk-server.labels" (dict "component" "hbbr" "context" $) | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- include "rustdesk-server.tplvalues" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels: {{- include "rustdesk-server.selectorLabels" (dict "component" "hbbr" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- if .Values.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- include "rustdesk-server.tplvalues" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- end }}
  ingress:
    - ports:
        - port: {{ $hbbr.containerPorts.relay | int64 }}
          protocol: TCP
        {{- if $hbbr.websocket.enabled }}
        - port: {{ $hbbr.containerPorts.websocket | int64 }}
          protocol: TCP
        {{- end }}
      {{- if not .Values.networkPolicy.allowExternal }}
      from:
        - podSelector:
            matchLabels:
              {{ include "rustdesk-server.fullname" . }}-client: "true"
        {{- with .Values.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- with $.Values.networkPolicy.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- include "rustdesk-server.tplvalues" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
