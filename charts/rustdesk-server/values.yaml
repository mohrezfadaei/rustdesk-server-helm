## @section Global parameters

global:
  ## Global Docker image parameters
  ## Please, note that this will override the image parameters, including dependencies, configured to use the global value
  ## @param global.imageRegistry Global Docker image registry
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  ##
  imageRegistry: ""
  imagePullSecrets: []
  ## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
  ##
  defaultStorageClass: ""
  ## Compatibility adaptations for Kubernetes platforms
  ##
  compatibility:
    ## Compatibility adaptations for Openshift
    ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the workloads to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
    ##
    openshift:
      adaptSecurityContext: auto

## @section Common parameters

## @param kubeVersion Override Kubernetes version reported by .Capabilities
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.name
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param clusterDomain Default Kubernetes cluster domain
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []
## Diagnostic mode
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the chart release
## @param diagnosticMode.args Args to override all containers in the chart release
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section RustDesk Server common parameters

## RustDesk Server image
## ref: https://hub.docker.com/r/rustdesk/rustdesk-server/tags/
## The scratch image ships hbbs, hbbr and rustdesk-utils; the binary is selected per component.
## @param image.registry [default: REGISTRY_NAME] RustDesk Server image registry
## @param image.repository [default: REPOSITORY_NAME/rustdesk-server] RustDesk Server image repository
## @skip image.tag RustDesk Server image tag (immutable tags are recommended)
## @param image.digest RustDesk Server image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy RustDesk Server image pull policy
## @param image.pullSecrets RustDesk Server image pull secrets
##
image:
  registry: docker.io
  repository: rustdesk/rustdesk-server
  tag: 1.1.16
  digest: ""
  ## Specify a imagePullPolicy
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets (secrets must be manually created in the namespace)
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ## e.g:
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: []
## RustDesk key pair used to encrypt client connections
## hbbs loads id_ed25519 / id_ed25519.pub from its working directory, generating them on first start
## when none exist. Clients must be configured with the matching public key.
## ref: https://rustdesk.com/docs/en/self-host/client-configuration/
##
auth:
  ## @param auth.existingSecret Name of an existing Secret containing the RustDesk key pair
  ## When empty, the key pair is taken from `auth.publicKey`/`auth.privateKey`, or generated by hbbs
  ## on first start when those are empty too.
  ##
  existingSecret: ""
  ## @param auth.publicKeySecretKey Key inside the existing Secret holding the public key
  ## @param auth.privateKeySecretKey Key inside the existing Secret holding the private key
  ##
  publicKeySecretKey: id_ed25519.pub
  privateKeySecretKey: id_ed25519
  ## @param auth.publicKey Contents of id_ed25519.pub, used when `auth.existingSecret` is not set
  ## @param auth.privateKey Contents of id_ed25519, used when `auth.existingSecret` is not set
  ## Set both or neither.
  ##
  publicKey: ""
  privateKey: ""
  ## @param auth.annotations Additional custom annotations for the RustDesk key pair Secret
  ##
  annotations: {}
  ## @param auth.relayKeyValidation Give hbbr the same key so it validates relay clients
  ## hbbr defaults to an empty key, which lets any client use the relay. Enabling this mounts the
  ## key pair into hbbr as well.
  ##
  relayKeyValidation: true
## @param relayServers Relay addresses advertised to clients, as an array of `host` or `host:port`
## Passed to hbbs as `-r`. Leave empty when hbbr is reachable at the same address as hbbs on the
## standard port 21117 - clients derive it automatically. Set it when the relay has its own
## hostname/IP or a non-standard port, which is the usual case on Kubernetes.
## e.g:
## relayServers:
##   - relay.example.com:21117
##
relayServers: []
## @param alwaysUseRelay Force every session through the relay, disabling direct connections
## Sets ALWAYS_USE_RELAY=Y on hbbs.
##
alwaysUseRelay: false
## @param logLevel Log level for hbbs and hbbr (RUST_LOG)
## Both binaries initialize logging before reading any config file, so this is always passed as a
## container environment variable.
##
logLevel: info

## @section hbbs (ID/rendezvous server) parameters

hbbs:
  ## @param hbbs.enabled Deploy the hbbs ID/rendezvous server
  ##
  enabled: true
  ## @param hbbs.replicaCount Number of hbbs replicas to deploy
  ## hbbs owns the SQLite peer database and the UDP registration state, so it does not scale
  ## horizontally. Keep this at 1.
  ##
  replicaCount: 1
  ## @param hbbs.command Override default container command (useful when using custom images)
  ## @param hbbs.args Override default container args (useful when using custom images)
  ##
  command: []
  args: []
  ## @param hbbs.workingDir Working directory of the hbbs process
  ## hbbs resolves its key pair, `.env` file and the default database path relative to its working
  ## directory, so this is also the path the persistent volume is mounted at.
  ##
  workingDir: /data
  ## @param hbbs.containerPorts.nat hbbs NAT type test container port (PORT-1)
  ## @param hbbs.containerPorts.main hbbs rendezvous container port, TCP and UDP (PORT)
  ## @param hbbs.containerPorts.websocket hbbs WebSocket rendezvous container port (PORT+2)
  ## The NAT and WebSocket ports are derived by hbbs from the main port and cannot be set
  ## independently; they are listed here so the Service and probes stay in sync.
  ##
  containerPorts:
    nat: 21115
    main: 21116
    websocket: 21118
  ## @param hbbs.websocket.enabled Expose the WebSocket port used by the RustDesk web client
  ## Disabled by default. hbbs trusts the X-Real-IP / X-Forwarded-For headers of WebSocket
  ## connections without validating them, so anyone able to reach this port directly can spoof
  ## client IPs. Only enable it behind a reverse proxy that sets X-Real-IP itself.
  ## ref: https://rustdesk.com/docs/en/self-host/rustdesk-server-oss/install/
  ##
  websocket:
    enabled: false
  ## @param hbbs.bind Local address hbbs binds all listeners to (BIND)
  ## Requires RustDesk Server 1.1.17 or later; it has no effect on 1.1.16 and earlier. Empty binds
  ## all interfaces.
  ##
  bind: ""
  ## @param hbbs.rmem UDP receive buffer size in bytes (RMEM), 0 uses the system default
  ## Values above the kernel default also require raising net.core.rmem_max on the node, which this
  ## chart does not do.
  ##
  rmem: 0
  ## @param hbbs.testHbbs UDP self-test target checked at start-up (TEST_HBBS)
  ## Set to `no` to skip the check, or to an explicit `host:port`. Empty uses the automatic target.
  ##
  testHbbs: ""
  ## hbbs SQLite database
  ##
  database:
    ## @param hbbs.database.url Path of the SQLite database file (DB_URL)
    ## Evaluated as a template. Defaults to a file on the persistent volume rather than the
    ## CWD-relative upstream default.
    ##
    url: '{{ .Values.hbbs.workingDir }}/db_v2.sqlite3'
    ## @param hbbs.database.maxConnections Size of the SQLite connection pool (MAX_DATABASE_CONNECTIONS)
    ##
    maxConnections: 1
  ## @param hbbs.extraEnvVars Array with extra environment variables to add to hbbs containers
  ## e.g:
  ## extraEnvVars:
  ##   - name: FOO
  ##     value: "bar"
  ##
  extraEnvVars: []
  ## @param hbbs.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for hbbs containers
  ## @param hbbs.extraEnvVarsSecret Name of existing Secret containing extra env vars for hbbs containers
  ##
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  ## @param hbbs.updateStrategy.type hbbs StatefulSet strategy type
  ##
  updateStrategy:
    type: RollingUpdate
  ## @param hbbs.podManagementPolicy Pod management policy for the hbbs StatefulSet
  ##
  podManagementPolicy: OrderedReady
  ## @param hbbs.revisionHistoryLimitCount Number of controller revisions to keep
  ##
  revisionHistoryLimitCount: 10
  ## @param hbbs.statefulsetAnnotations Optionally add extra annotations on the hbbs StatefulSet resource
  ##
  statefulsetAnnotations: {}
  ## @param hbbs.automountServiceAccountToken Mount Service Account token in hbbs pods
  ##
  automountServiceAccountToken: false
  ## @param hbbs.hostAliases hbbs pod host aliases
  ##
  hostAliases: []
  ## @param hbbs.hostNetwork Run hbbs pods in the host network namespace
  ## An alternative to a LoadBalancer Service when hbbs must observe real client source addresses on
  ## a cluster without one.
  ##
  hostNetwork: false
  ## @param hbbs.dnsPolicy DNS policy for hbbs pods
  ## Set to ClusterFirstWithHostNet when `hbbs.hostNetwork` is enabled.
  ##
  dnsPolicy: ""
  ## @param hbbs.dnsConfig DNS configuration for hbbs pods
  ##
  dnsConfig: {}
  ## @param hbbs.podLabels Extra labels for hbbs pods
  ## @param hbbs.podAnnotations Annotations for hbbs pods
  ##
  podLabels: {}
  podAnnotations: {}
  ## @param hbbs.podAffinityPreset Pod affinity preset. Ignored if `hbbs.affinity` is set. Allowed values: `soft` or `hard`
  ## @param hbbs.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `hbbs.affinity` is set. Allowed values: `soft` or `hard`
  ##
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    ## @param hbbs.nodeAffinityPreset.type Node affinity preset type. Ignored if `hbbs.affinity` is set. Allowed values: `soft` or `hard`
    ## @param hbbs.nodeAffinityPreset.key Node label key to match. Ignored if `hbbs.affinity` is set.
    ## @param hbbs.nodeAffinityPreset.values Node label values to match. Ignored if `hbbs.affinity` is set.
    ##
    type: ""
    key: ""
    values: []
  ## @param hbbs.affinity Affinity for hbbs pod assignment
  ## @param hbbs.nodeSelector Node labels for hbbs pod assignment
  ## @param hbbs.tolerations Tolerations for hbbs pod assignment
  ## @param hbbs.topologySpreadConstraints Topology Spread Constraints for hbbs pod assignment
  ##
  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  ## @param hbbs.priorityClassName hbbs pods' Priority Class Name
  ## @param hbbs.schedulerName Use an alternate scheduler, e.g. "stork".
  ## @param hbbs.terminationGracePeriodSeconds Seconds hbbs pods need to terminate gracefully
  ##
  priorityClassName: ""
  schedulerName: ""
  terminationGracePeriodSeconds: ""
  ## @param hbbs.lifecycleHooks LifecycleHooks for the hbbs container to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  ## hbbs pods' Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  ## @param hbbs.podSecurityContext.enabled Enabled hbbs pods' Security Context
  ## @param hbbs.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
  ## @param hbbs.podSecurityContext.sysctls Set kernel settings using the sysctl interface
  ## @param hbbs.podSecurityContext.supplementalGroups Set filesystem extra groups
  ## @param hbbs.podSecurityContext.fsGroup Set hbbs pod's Security Context fsGroup
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  ## hbbs container's Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  ## @param hbbs.containerSecurityContext.enabled Enabled hbbs container's Security Context
  ## @param hbbs.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
  ## @param hbbs.containerSecurityContext.runAsUser Set hbbs container's Security Context runAsUser
  ## @param hbbs.containerSecurityContext.runAsGroup Set hbbs container's Security Context runAsGroup
  ## @param hbbs.containerSecurityContext.runAsNonRoot Set hbbs container's Security Context runAsNonRoot
  ## @param hbbs.containerSecurityContext.readOnlyRootFilesystem Set hbbs container's Security Context readOnlyRootFilesystem
  ## @param hbbs.containerSecurityContext.privileged Set hbbs container's Security Context privileged
  ## @param hbbs.containerSecurityContext.allowPrivilegeEscalation Set hbbs container's Security Context allowPrivilegeEscalation
  ## @param hbbs.containerSecurityContext.capabilities.drop List of capabilities to be dropped
  ## @param hbbs.containerSecurityContext.seccompProfile.type Set hbbs container's Security Context seccomp profile
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  ## hbbs resource requests and limits
  ## ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  ## @param hbbs.resourcesPreset Set hbbs container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if hbbs.resources is set.
  ## hbbs only brokers connections, so the smallest preset is normally enough.
  ## @param hbbs.resources Set hbbs container requests and limits for different resources like CPU or memory
  ##
  resourcesPreset: nano
  resources: {}
  ## hbbs liveness probe
  ## The OSS server exposes no health endpoint, so probes check that the rendezvous port accepts TCP.
  ## @param hbbs.livenessProbe.enabled Enable livenessProbe on hbbs containers
  ## @param hbbs.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param hbbs.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param hbbs.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param hbbs.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param hbbs.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  ## @param hbbs.readinessProbe.enabled Enable readinessProbe on hbbs containers
  ## @param hbbs.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param hbbs.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param hbbs.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param hbbs.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param hbbs.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  ## @param hbbs.startupProbe.enabled Enable startupProbe on hbbs containers
  ## @param hbbs.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  ## @param hbbs.startupProbe.periodSeconds Period seconds for startupProbe
  ## @param hbbs.startupProbe.timeoutSeconds Timeout seconds for startupProbe
  ## @param hbbs.startupProbe.failureThreshold Failure threshold for startupProbe
  ## @param hbbs.startupProbe.successThreshold Success threshold for startupProbe
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  ## @param hbbs.customLivenessProbe Custom livenessProbe that overrides the default one
  ## @param hbbs.customReadinessProbe Custom readinessProbe that overrides the default one
  ## @param hbbs.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  ## @param hbbs.extraVolumes Optionally specify extra list of additional volumes for hbbs pods
  ## @param hbbs.extraVolumeMounts Optionally specify extra list of additional volumeMounts for hbbs containers
  ## @param hbbs.initContainers Add additional init containers to the hbbs pods
  ## @param hbbs.sidecars Add additional sidecar containers to the hbbs pods
  ##
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  sidecars: []
  ## hbbs persistence, holding the key pair and the SQLite peer database
  ## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  ##
  persistence:
    ## @param hbbs.persistence.enabled Enable persistence for hbbs using a PersistentVolumeClaim
    ## Disabling this makes hbbs regenerate its key pair whenever the pod is recreated, which
    ## invalidates every already-configured client, unless `auth.existingSecret` supplies the pair.
    ##
    enabled: true
    ## @param hbbs.persistence.existingClaim Name of an existing PVC to use for hbbs
    ##
    existingClaim: ""
    ## @param hbbs.persistence.storageClass PVC Storage Class for hbbs data volume
    ## If defined, storageClassName: <storageClass>. If set to "-", storageClassName: "".
    ## If undefined or empty, no storageClassName spec is set, choosing the default provisioner.
    ##
    storageClass: ""
    ## @param hbbs.persistence.accessModes PVC Access Modes for hbbs data volume
    ##
    accessModes:
      - ReadWriteOnce
    ## @param hbbs.persistence.size PVC Storage Request for hbbs data volume
    ##
    size: 1Gi
    ## @param hbbs.persistence.annotations Annotations for the hbbs PVC
    ## @param hbbs.persistence.labels Labels for the hbbs PVC
    ## @param hbbs.persistence.selector Selector to match an existing Persistent Volume for hbbs data PVC
    ##
    annotations: {}
    labels: {}
    selector: {}
  ## hbbs service parameters
  ##
  service:
    ## @param hbbs.service.type hbbs Kubernetes service type
    ## Clients reach hbbs from outside the cluster, and UDP 21116 cannot be carried by an HTTP
    ## Ingress, so LoadBalancer or NodePort is required in practice.
    ##
    type: LoadBalancer
    ## @param hbbs.service.ports.nat hbbs NAT type test service port
    ## @param hbbs.service.ports.main hbbs rendezvous service port, exposed as both TCP and UDP
    ## @param hbbs.service.ports.websocket hbbs WebSocket service port
    ##
    ports:
      nat: 21115
      main: 21116
      websocket: 21118
    ## @param hbbs.service.nodePorts.nat Node port for the NAT type test port
    ## @param hbbs.service.nodePorts.mainTCP Node port for the rendezvous TCP port
    ## @param hbbs.service.nodePorts.mainUDP Node port for the rendezvous UDP port
    ## @param hbbs.service.nodePorts.websocket Node port for the WebSocket port
    ## Clients address hbbs by its rendezvous port, so a NodePort deployment needs the default
    ## 30000-32767 range widened to keep 21115-21116 usable.
    ##
    nodePorts:
      nat: ""
      mainTCP: ""
      mainUDP: ""
      websocket: ""
    ## @param hbbs.service.extraPorts Extra ports to expose on the hbbs service
    ##
    extraPorts: []
    ## @param hbbs.service.clusterIP hbbs service Cluster IP
    ## @param hbbs.service.loadBalancerIP hbbs service Load Balancer IP
    ## @param hbbs.service.loadBalancerClass hbbs service Load Balancer class (optional, cloud specific)
    ## @param hbbs.service.loadBalancerSourceRanges Addresses that are allowed when the service is LoadBalancer
    ##
    clusterIP: ""
    loadBalancerIP: ""
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    ## @param hbbs.service.externalTrafficPolicy Enable client source IP preservation for hbbs
    ## hbbs derives peer addresses from the connection source, so it must observe the real client IP.
    ## Cluster-wide SNAT breaks NAT traversal, which is why this defaults to Local.
    ## ref: https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    ##
    externalTrafficPolicy: Local
    ## @param hbbs.service.sessionAffinity Control where client requests go, to the same pod or round-robin
    ## @param hbbs.service.sessionAffinityConfig Additional settings for the sessionAffinity
    ##
    sessionAffinity: None
    sessionAffinityConfig: {}
    ## @param hbbs.service.annotations Additional custom annotations for the hbbs service
    ##
    annotations: {}
  ## hbbs WebSocket ingress parameters
  ## Only the WebSocket port (hbbs.containerPorts.websocket) speaks HTTP and can be exposed this
  ## way. The rendezvous, NAT test and UDP ports need `hbbs.service`, because the Ingress API models neither raw TCP nor UDP.
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ##
  ingress:
    ## @param hbbs.ingress.enabled Enable ingress record generation for the hbbs WebSocket port
    ## Requires `hbbs.websocket.enabled`. Terminating TLS here is how the web client gets WSS.
    ## The proxy must set X-Real-IP itself, and port 21118 should be reachable only from the
    ## proxy, since hbbs trusts that header without validating it.
    ##
    enabled: false
    ## @param hbbs.ingress.pathType Ingress path type
    ##
    pathType: ImplementationSpecific
    ## @param hbbs.ingress.apiVersion Force Ingress API version (automatically detected if not set)
    ##
    apiVersion: ""
    ## @param hbbs.ingress.hostname Default host for the ingress record (evaluated as template)
    ##
    hostname: hbbs.local
    ## @param hbbs.ingress.ingressClassName IngressClass that will be used to implement the Ingress (evaluated as template)
    ##
    ingressClassName: ""
    ## @param hbbs.ingress.path Default path for the ingress record (evaluated as template)
    ##
    path: /
    ## @param hbbs.ingress.annotations Additional annotations for the Ingress resource
    ## Most controllers need an explicit WebSocket upgrade or a longer read timeout here, e.g. for
    ## ingress-nginx:
    ## annotations:
    ##   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    ##   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    ##
    annotations: {}
    ## @param hbbs.ingress.labels Additional labels for the Ingress resource
    ##
    labels: {}
    ## @param hbbs.ingress.tls Enable TLS for `hbbs.ingress.hostname`, using a Secret named `<hostname>-tls`
    ## Create that Secret yourself, list it in `hbbs.ingress.secrets`, or let cert-manager issue it
    ## from an annotation.
    ##
    tls: false
    ## @param hbbs.ingress.extraHosts The list of additional hostnames to be covered with this ingress record
    ## e.g:
    ## extraHosts:
    ##   - name: hbbs.local
    ##     path: /
    ##
    extraHosts: []
    ## @param hbbs.ingress.extraPaths Any additional paths that may need to be added to the ingress under the main host
    ##
    extraPaths: []
    ## @param hbbs.ingress.extraTls The tls configuration for additional hostnames to be covered with this ingress record
    ##
    extraTls: []
    ## @param hbbs.ingress.secrets Custom TLS certificates as secrets
    ## e.g:
    ## secrets:
    ##   - name: hbbs.local-tls
    ##     certificate: |-
    ##       -----BEGIN CERTIFICATE-----
    ##     key: |-
    ##       -----BEGIN RSA PRIVATE KEY-----
    ##
    secrets: []
  ## hbbs pod disruption budget
  ## @param hbbs.pdb.create Enable/disable a Pod Disruption Budget creation for hbbs
  ## @param hbbs.pdb.minAvailable Minimum number/percentage of hbbs pods that should remain scheduled
  ## @param hbbs.pdb.maxUnavailable Maximum number/percentage of hbbs pods that may be made unavailable. Defaults to `1` if both `hbbs.pdb.minAvailable` and `hbbs.pdb.maxUnavailable` are empty.
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

## @section hbbr (relay server) parameters

hbbr:
  ## @param hbbr.enabled Deploy the hbbr relay server
  ##
  enabled: true
  ## @param hbbr.replicaCount Number of hbbr replicas to deploy
  ## hbbr keeps no cross-session state, but both peers of a session must land on the same replica,
  ## so raising this requires `hbbr.service.sessionAffinity=ClientIP` or one Service per replica.
  ##
  replicaCount: 1
  ## @param hbbr.command Override default container command (useful when using custom images)
  ## @param hbbr.args Override default container args (useful when using custom images)
  ##
  command: []
  args: []
  ## @param hbbr.workingDir Working directory of the hbbr process
  ## hbbr reads its key pair, blacklist.txt and blocklist.txt relative to its working directory.
  ##
  workingDir: /data
  ## @param hbbr.containerPorts.relay hbbr relay container port (PORT)
  ## @param hbbr.containerPorts.websocket hbbr WebSocket relay container port (PORT+2)
  ## The relay port is passed to hbbr with the `-p` flag rather than the PORT environment variable,
  ## because hbbr listens on PORT+1 when the value comes from the environment.
  ##
  containerPorts:
    relay: 21117
    websocket: 21119
  ## @param hbbr.websocket.enabled Expose the WebSocket relay port used by the RustDesk web client
  ## Disabled by default, for the same header-spoofing reason as `hbbs.websocket.enabled`.
  ##
  websocket:
    enabled: false
  ## @param hbbr.bind Local address hbbr binds its listeners to (BIND)
  ## Requires RustDesk Server 1.1.17 or later. Empty binds all interfaces.
  ##
  bind: ""
  ## hbbr bandwidth limits, in Mb/s unless noted
  ## A connection is capped to `limitSpeed` once its lifetime average throughput exceeds
  ## `singleBandwidth * downgradeThreshold`. That decision is per connection and ignores aggregate
  ## load, so a single long transfer can be downgraded on an otherwise idle relay.
  ##
  bandwidth:
    ## @param hbbr.bandwidth.singleBandwidth Normal maximum bandwidth per relay connection, in Mb/s (SINGLE_BANDWIDTH)
    ## @param hbbr.bandwidth.totalBandwidth Aggregate bandwidth cap shared by all relay connections, in Mb/s (TOTAL_BANDWIDTH)
    ## @param hbbr.bandwidth.limitSpeed Cap applied to downgraded connections and blacklisted IPs, in Mb/s (LIMIT_SPEED)
    ## @param hbbr.bandwidth.downgradeThreshold Fraction of singleBandwidth that triggers a downgrade, 0-1 (DOWNGRADE_THRESHOLD)
    ## @param hbbr.bandwidth.downgradeStartCheck Seconds before a connection becomes eligible for downgrade (DOWNGRADE_START_CHECK)
    ##
    singleBandwidth: 128
    totalBandwidth: 1024
    limitSpeed: 32
    downgradeThreshold: 0.66
    downgradeStartCheck: 1800
  ## @param hbbr.blacklist IP addresses that hbbr limits to `hbbr.bandwidth.limitSpeed`, as an array
  ## Rendered into blacklist.txt in the working directory.
  ## e.g:
  ## blacklist:
  ##   - 203.0.113.7
  ##
  blacklist: []
  ## @param hbbr.blocklist IP addresses that hbbr refuses outright, as an array
  ## Rendered into blocklist.txt in the working directory.
  ##
  blocklist: []
  ## @param hbbr.extraEnvVars Array with extra environment variables to add to hbbr containers
  ## @param hbbr.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for hbbr containers
  ## @param hbbr.extraEnvVarsSecret Name of existing Secret containing extra env vars for hbbr containers
  ##
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  ## @param hbbr.updateStrategy.type hbbr StatefulSet strategy type
  ##
  updateStrategy:
    type: RollingUpdate
  ## @param hbbr.podManagementPolicy Pod management policy for the hbbr StatefulSet
  ##
  podManagementPolicy: OrderedReady
  ## @param hbbr.revisionHistoryLimitCount Number of controller revisions to keep
  ##
  revisionHistoryLimitCount: 10
  ## @param hbbr.statefulsetAnnotations Optionally add extra annotations on the hbbr StatefulSet resource
  ##
  statefulsetAnnotations: {}
  ## @param hbbr.automountServiceAccountToken Mount Service Account token in hbbr pods
  ##
  automountServiceAccountToken: false
  ## @param hbbr.hostAliases hbbr pod host aliases
  ##
  hostAliases: []
  ## @param hbbr.hostNetwork Run hbbr pods in the host network namespace
  ##
  hostNetwork: false
  ## @param hbbr.dnsPolicy DNS policy for hbbr pods
  ## @param hbbr.dnsConfig DNS configuration for hbbr pods
  ##
  dnsPolicy: ""
  dnsConfig: {}
  ## @param hbbr.podLabels Extra labels for hbbr pods
  ## @param hbbr.podAnnotations Annotations for hbbr pods
  ##
  podLabels: {}
  podAnnotations: {}
  ## @param hbbr.podAffinityPreset Pod affinity preset. Ignored if `hbbr.affinity` is set. Allowed values: `soft` or `hard`
  ## @param hbbr.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `hbbr.affinity` is set. Allowed values: `soft` or `hard`
  ##
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    ## @param hbbr.nodeAffinityPreset.type Node affinity preset type. Ignored if `hbbr.affinity` is set. Allowed values: `soft` or `hard`
    ## @param hbbr.nodeAffinityPreset.key Node label key to match. Ignored if `hbbr.affinity` is set.
    ## @param hbbr.nodeAffinityPreset.values Node label values to match. Ignored if `hbbr.affinity` is set.
    ##
    type: ""
    key: ""
    values: []
  ## @param hbbr.affinity Affinity for hbbr pod assignment
  ## @param hbbr.nodeSelector Node labels for hbbr pod assignment
  ## @param hbbr.tolerations Tolerations for hbbr pod assignment
  ## @param hbbr.topologySpreadConstraints Topology Spread Constraints for hbbr pod assignment
  ##
  affinity: {}
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  ## @param hbbr.priorityClassName hbbr pods' Priority Class Name
  ## @param hbbr.schedulerName Use an alternate scheduler, e.g. "stork".
  ## @param hbbr.terminationGracePeriodSeconds Seconds hbbr pods need to terminate gracefully
  ## Relayed sessions are dropped when the pod exits, so allow in-flight sessions to finish.
  ##
  priorityClassName: ""
  schedulerName: ""
  terminationGracePeriodSeconds: ""
  ## @param hbbr.lifecycleHooks LifecycleHooks for the hbbr container to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  ## @param hbbr.podSecurityContext.enabled Enabled hbbr pods' Security Context
  ## @param hbbr.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
  ## @param hbbr.podSecurityContext.sysctls Set kernel settings using the sysctl interface
  ## @param hbbr.podSecurityContext.supplementalGroups Set filesystem extra groups
  ## @param hbbr.podSecurityContext.fsGroup Set hbbr pod's Security Context fsGroup
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  ## @param hbbr.containerSecurityContext.enabled Enabled hbbr container's Security Context
  ## @param hbbr.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
  ## @param hbbr.containerSecurityContext.runAsUser Set hbbr container's Security Context runAsUser
  ## @param hbbr.containerSecurityContext.runAsGroup Set hbbr container's Security Context runAsGroup
  ## @param hbbr.containerSecurityContext.runAsNonRoot Set hbbr container's Security Context runAsNonRoot
  ## @param hbbr.containerSecurityContext.readOnlyRootFilesystem Set hbbr container's Security Context readOnlyRootFilesystem
  ## @param hbbr.containerSecurityContext.privileged Set hbbr container's Security Context privileged
  ## @param hbbr.containerSecurityContext.allowPrivilegeEscalation Set hbbr container's Security Context allowPrivilegeEscalation
  ## @param hbbr.containerSecurityContext.capabilities.drop List of capabilities to be dropped
  ## @param hbbr.containerSecurityContext.seccompProfile.type Set hbbr container's Security Context seccomp profile
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  ## @param hbbr.resourcesPreset Set hbbr container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if hbbr.resources is set.
  ## Relayed sessions run between 30 KB/s and 3 MB/s each, so size this by expected relay volume.
  ## @param hbbr.resources Set hbbr container requests and limits for different resources like CPU or memory
  ##
  resourcesPreset: nano
  resources: {}
  ## @param hbbr.livenessProbe.enabled Enable livenessProbe on hbbr containers
  ## @param hbbr.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param hbbr.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param hbbr.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param hbbr.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param hbbr.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  ## @param hbbr.readinessProbe.enabled Enable readinessProbe on hbbr containers
  ## @param hbbr.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param hbbr.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param hbbr.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param hbbr.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param hbbr.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  ## @param hbbr.startupProbe.enabled Enable startupProbe on hbbr containers
  ## @param hbbr.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  ## @param hbbr.startupProbe.periodSeconds Period seconds for startupProbe
  ## @param hbbr.startupProbe.timeoutSeconds Timeout seconds for startupProbe
  ## @param hbbr.startupProbe.failureThreshold Failure threshold for startupProbe
  ## @param hbbr.startupProbe.successThreshold Success threshold for startupProbe
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  ## @param hbbr.customLivenessProbe Custom livenessProbe that overrides the default one
  ## @param hbbr.customReadinessProbe Custom readinessProbe that overrides the default one
  ## @param hbbr.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  ## @param hbbr.extraVolumes Optionally specify extra list of additional volumes for hbbr pods
  ## @param hbbr.extraVolumeMounts Optionally specify extra list of additional volumeMounts for hbbr containers
  ## @param hbbr.initContainers Add additional init containers to the hbbr pods
  ## @param hbbr.sidecars Add additional sidecar containers to the hbbr pods
  ##
  extraVolumes: []
  extraVolumeMounts: []
  initContainers: []
  sidecars: []
  ## hbbr persistence
  ## hbbr keeps no database. A volume is only needed when it should hold its own key pair rather
  ## than receiving one from `auth`.
  ##
  persistence:
    ## @param hbbr.persistence.enabled Enable persistence for hbbr using a PersistentVolumeClaim
    ## @param hbbr.persistence.existingClaim Name of an existing PVC to use for hbbr
    ## @param hbbr.persistence.storageClass PVC Storage Class for hbbr data volume
    ## @param hbbr.persistence.accessModes PVC Access Modes for hbbr data volume
    ## @param hbbr.persistence.size PVC Storage Request for hbbr data volume
    ## @param hbbr.persistence.annotations Annotations for the hbbr PVC
    ## @param hbbr.persistence.labels Labels for the hbbr PVC
    ## @param hbbr.persistence.selector Selector to match an existing Persistent Volume for hbbr data PVC
    ##
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}
    labels: {}
    selector: {}
  ## hbbr service parameters
  ##
  service:
    ## @param hbbr.service.type hbbr Kubernetes service type
    ## Relay traffic arrives from clients outside the cluster on TCP 21117.
    ##
    type: LoadBalancer
    ## @param hbbr.service.ports.relay hbbr relay service port
    ## @param hbbr.service.ports.websocket hbbr WebSocket relay service port
    ##
    ports:
      relay: 21117
      websocket: 21119
    ## @param hbbr.service.nodePorts.relay Node port for the relay port
    ## @param hbbr.service.nodePorts.websocket Node port for the WebSocket relay port
    ##
    nodePorts:
      relay: ""
      websocket: ""
    ## @param hbbr.service.extraPorts Extra ports to expose on the hbbr service
    ##
    extraPorts: []
    ## @param hbbr.service.clusterIP hbbr service Cluster IP
    ## @param hbbr.service.loadBalancerIP hbbr service Load Balancer IP
    ## @param hbbr.service.loadBalancerClass hbbr service Load Balancer class (optional, cloud specific)
    ## @param hbbr.service.loadBalancerSourceRanges Addresses that are allowed when the service is LoadBalancer
    ##
    clusterIP: ""
    loadBalancerIP: ""
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
    ## @param hbbr.service.externalTrafficPolicy Enable client source IP preservation for hbbr
    ## The real client IP is what the bandwidth limits and blocklists are applied to.
    ##
    externalTrafficPolicy: Local
    ## @param hbbr.service.sessionAffinity Control where client requests go, to the same pod or round-robin
    ## Set to ClientIP when `hbbr.replicaCount` is greater than 1.
    ## @param hbbr.service.sessionAffinityConfig Additional settings for the sessionAffinity
    ##
    sessionAffinity: None
    sessionAffinityConfig: {}
    ## @param hbbr.service.annotations Additional custom annotations for the hbbr service
    ##
    annotations: {}
  ## hbbr WebSocket ingress parameters
  ## Only the WebSocket port (hbbr.containerPorts.websocket) speaks HTTP and can be exposed this
  ## way. The relay port need `hbbr.service`, because the Ingress API models neither raw TCP nor UDP.
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ##
  ingress:
    ## @param hbbr.ingress.enabled Enable ingress record generation for the hbbr WebSocket port
    ## Requires `hbbr.websocket.enabled`. Terminating TLS here is how the web client gets WSS.
    ## The proxy must set X-Real-IP itself, and port 21119 should be reachable only from the
    ## proxy, since hbbr trusts that header without validating it.
    ##
    enabled: false
    ## @param hbbr.ingress.pathType Ingress path type
    ##
    pathType: ImplementationSpecific
    ## @param hbbr.ingress.apiVersion Force Ingress API version (automatically detected if not set)
    ##
    apiVersion: ""
    ## @param hbbr.ingress.hostname Default host for the ingress record (evaluated as template)
    ##
    hostname: hbbr.local
    ## @param hbbr.ingress.ingressClassName IngressClass that will be used to implement the Ingress (evaluated as template)
    ##
    ingressClassName: ""
    ## @param hbbr.ingress.path Default path for the ingress record (evaluated as template)
    ##
    path: /
    ## @param hbbr.ingress.annotations Additional annotations for the Ingress resource
    ## Most controllers need an explicit WebSocket upgrade or a longer read timeout here, e.g. for
    ## ingress-nginx:
    ## annotations:
    ##   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    ##   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    ##
    annotations: {}
    ## @param hbbr.ingress.labels Additional labels for the Ingress resource
    ##
    labels: {}
    ## @param hbbr.ingress.tls Enable TLS for `hbbr.ingress.hostname`, using a Secret named `<hostname>-tls`
    ## Create that Secret yourself, list it in `hbbr.ingress.secrets`, or let cert-manager issue it
    ## from an annotation.
    ##
    tls: false
    ## @param hbbr.ingress.extraHosts The list of additional hostnames to be covered with this ingress record
    ## e.g:
    ## extraHosts:
    ##   - name: hbbr.local
    ##     path: /
    ##
    extraHosts: []
    ## @param hbbr.ingress.extraPaths Any additional paths that may need to be added to the ingress under the main host
    ##
    extraPaths: []
    ## @param hbbr.ingress.extraTls The tls configuration for additional hostnames to be covered with this ingress record
    ##
    extraTls: []
    ## @param hbbr.ingress.secrets Custom TLS certificates as secrets
    ## e.g:
    ## secrets:
    ##   - name: hbbr.local-tls
    ##     certificate: |-
    ##       -----BEGIN CERTIFICATE-----
    ##     key: |-
    ##       -----BEGIN RSA PRIVATE KEY-----
    ##
    secrets: []
  ## @param hbbr.pdb.create Enable/disable a Pod Disruption Budget creation for hbbr
  ## @param hbbr.pdb.minAvailable Minimum number/percentage of hbbr pods that should remain scheduled
  ## @param hbbr.pdb.maxUnavailable Maximum number/percentage of hbbr pods that may be made unavailable. Defaults to `1` if both `hbbr.pdb.minAvailable` and `hbbr.pdb.maxUnavailable` are empty.
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

## @section Other parameters

## ServiceAccount configuration, shared by hbbs and hbbr
##
serviceAccount:
  ## @param serviceAccount.create Specifies whether a ServiceAccount should be created
  ## @param serviceAccount.name The name of the ServiceAccount to use. If not set and create is true, a name is generated using the common.names.fullname template
  ## @param serviceAccount.annotations Additional Service Account annotations (evaluated as a template)
  ## @param serviceAccount.labels Additional Service Account labels (evaluated as a template)
  ## @param serviceAccount.automountServiceAccountToken Automount service account token for the ServiceAccount
  ##
  create: true
  name: ""
  annotations: {}
  labels: {}
  automountServiceAccountToken: false
## NetworkPolicy parameters
##
networkPolicy:
  ## @param networkPolicy.enabled Specifies whether a NetworkPolicy should be created
  ##
  enabled: true
  ## @param networkPolicy.allowExternal Don't require client label for connections
  ## Both servers are contacted by RustDesk clients from outside the cluster, so ingress is
  ## unrestricted by default. Setting this to false only makes sense behind an external proxy.
  ##
  allowExternal: true
  ## @param networkPolicy.allowExternalEgress Allow the pods to access any range of ports and hosts
  ##
  allowExternalEgress: true
  ## @param networkPolicy.extraIngress Add extra ingress rules to the NetworkPolicy
  ## @param networkPolicy.extraEgress Add extra egress rules to the NetworkPolicy
  ##
  extraIngress: []
  extraEgress: []
  ## @param networkPolicy.ingressNSMatchLabels Labels to match to allow traffic from other namespaces
  ## @param networkPolicy.ingressNSPodMatchLabels Pod labels to match to allow traffic from other namespaces
  ##
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}
